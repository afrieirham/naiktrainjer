<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Near LRT Homes — Walk & Drive to Station</title>
    <meta
      name="description"
      content="Browse homes and areas near LRT stations. See walking and driving routes from each property to the nearest LRT."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 999px;
      }
      .map-frame {
        min-height: 320px;
        height: 50vh;
      }
      @media (min-width: 768px) {
        .map-frame {
          height: calc(100vh - 13rem);
          min-height: 480px;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
        <div
          class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"
        >
          <div>
            <h1
              class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight"
            >
              Near LRT Homes
            </h1>
            <p class="text-sm text-slate-500 mt-0.5">
              Property → LRT · walk or drive directions
            </p>
          </div>

          <div class="flex flex-wrap items-center gap-3">
            <span
              class="text-xs font-semibold uppercase tracking-wide text-slate-400"
            >
              Route mode
            </span>
            <div
              class="inline-flex rounded-xl bg-slate-100 p-1"
              id="mode-group"
              role="group"
              aria-label="Travel mode"
            >
              <button
                type="button"
                data-mode="walk"
                class="mode-btn px-4 py-2 rounded-lg text-sm font-semibold transition"
              >
                Walk
              </button>
              <button
                type="button"
                data-mode="drive"
                class="mode-btn px-4 py-2 rounded-lg text-sm font-semibold transition"
              >
                Drive
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-5">
      <div
        class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col md:flex-row"
      >
        <!-- Sidebar list -->
        <aside
          class="md:w-[380px] lg:w-[420px] border-b md:border-b-0 md:border-r border-slate-200 flex flex-col max-h-[42vh] md:max-h-none"
        >
          <div
            class="p-3 sm:p-4 border-b border-slate-100 space-y-2.5 shrink-0"
          >
            <div class="relative">
              <svg
                class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                id="search"
                type="search"
                placeholder="Search by name…"
                autocomplete="off"
                class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"
              />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-1 gap-2">
              <select
                id="station-filter"
                class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm bg-white outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"
              >
                <option value="">All stations</option>
              </select>
              <select
                id="type-filter"
                class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm bg-white outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"
              >
                <option value="">All types</option>
              </select>
            </div>

            <div class="flex items-center justify-between pt-0.5">
              <p id="result-count" class="text-xs text-slate-500"></p>
              <button
                type="button"
                id="reset-filters"
                class="text-xs font-semibold text-sky-600 hover:text-sky-800"
              >
                Reset
              </button>
            </div>
          </div>

          <div
            id="list"
            class="overflow-y-auto scrollbar-thin flex-1 divide-y divide-slate-100"
            role="listbox"
            aria-label="Properties"
          ></div>
        </aside>

        <!-- Detail + map -->
        <section class="flex-1 flex flex-col min-w-0">
          <div
            id="detail"
            class="px-4 sm:px-5 py-4 border-b border-slate-100 shrink-0"
          ></div>

          <div class="relative bg-slate-100 flex-1">
            <iframe
              id="map"
              class="map-frame w-full border-0 block hidden"
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
              title="Walking or driving directions to LRT station"
            ></iframe>

            <div
              id="map-empty"
              class="map-frame w-full flex items-center justify-center p-6"
            >
              <div class="max-w-sm text-center">
                <div
                  class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-white border border-slate-200 shadow-sm"
                >

                    class="w-6 h-6 text-slate-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >

                      stroke-width="1.75"
                      d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"
                    />

                </div>
                <p class="font-semibold text-slate-800" id="map-empty-title">
                  Select a property
                </p>
                <p class="text-sm text-slate-500 mt-1" id="map-empty-body">
                  Walking and driving routes to the LRT will appear here.
                </p>
              </div>
            </div>
          </div>
        </section>
      </div>

      <p class="mt-5 text-center text-xs text-slate-400">
        Routes open as Google Maps embeds · default mode is Walk
      </p>
    </main>

        },
        {
          name: "Bangsar Hill Park",
          map: "",
          type: "Condominium",
          station: "LRT Bangsar",
          propertyGuru: "",
          directions: { walk: "", drive: "" },
        },
        {
          name: "Sri Bangsar Apartment",
          map: "",
          type: "Condominium",
          station: "LRT Bangsar",
          propertyGuru: "",
          directions: { walk: "", drive: "" },
        },
      ];

      // ——— State ———
      let selectedName = properties[0].name;
      let mode = "walk"; // walk | drive

      // ——— Filters init ———
      const stations = [...new Set(properties.map((p) => p.station))].sort(
        (a, b) => a.localeCompare(b),
      );
      const types = [...new Set(properties.map((p) => p.type))].sort((a, b) =>
        a.localeCompare(b),
      );

      const stationFilter = document.getElementById("station-filter");
      const typeFilter = document.getElementById("type-filter");

      stations.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        stationFilter.appendChild(opt);
      });
      types.forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        typeFilter.appendChild(opt);
      });

      // ——— Helpers ———
      function typeClasses(type) {
        const map = {
          "Service Apartment": "bg-teal-50 text-teal-700 ring-teal-600/15",
          Apartment: "bg-sky-50 text-sky-700 ring-sky-600/15",
          Condominium: "bg-violet-50 text-violet-700 ring-violet-600/15",
          Flat: "bg-amber-50 text-amber-800 ring-amber-600/15",
          Terrace: "bg-orange-50 text-orange-800 ring-orange-600/15",
          "Shop/Office": "bg-rose-50 text-rose-700 ring-rose-600/15",
          Area: "bg-slate-100 text-slate-600 ring-slate-500/10",
        };
        return map[type] || "bg-slate-100 text-slate-600 ring-slate-500/10";
      }

      function badge(text, classes) {
        return `<span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${classes}">${escapeHtml(
          text,
        )}</span>`;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function embedFor(property, travelMode) {
        if (!property.directions) return "";
        return (property.directions[travelMode] || "").trim();
      }

      /** Full Google Maps directions (opens in new tab) — useful even before embeds are pasted */
      function googleDirUrl(property, travelMode) {
        const travelmode = travelMode === "drive" ? "driving" : "walking";
        const origin = `${property.name}, Malaysia`;
        const destination = `${property.station}, Malaysia`;
        return (
          "https://www.google.com/maps/dir/?api=1" +
          `&origin=${encodeURIComponent(origin)}` +
          `&destination=${encodeURIComponent(destination)}` +
          `&travelmode=${travelmode}`
        );
      }

      function filteredList() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        const station = stationFilter.value;
        const type = typeFilter.value;
        return properties.filter((p) => {
          if (q && !p.name.toLowerCase().includes(q)) return false;
          if (station && p.station !== station) return false;
          if (type && p.type !== type) return false;
          return true;
        });
      }

      function paintModeButtons() {
        document.querySelectorAll(".mode-btn").forEach((btn) => {
          const active = btn.dataset.mode === mode;
          btn.classList.toggle("bg-white", active);
          btn.classList.toggle("text-slate-900", active);
          btn.classList.toggle("shadow-sm", active);
          btn.classList.toggle("text-slate-500", !active);
        });
      }

      function setMap(src) {
        const iframe = document.getElementById("map");
        const empty = document.getElementById("map-empty");

        if (src) {
          empty.classList.add("hidden");
          iframe.classList.remove("hidden");
          if (iframe.getAttribute("src") !== src) {
            iframe.src = src;
          }
        } else {
          iframe.classList.add("hidden");
          iframe.removeAttribute("src");
          empty.classList.remove("hidden");
        }
      }

      function renderList() {
        const list = filteredList();
        const el = document.getElementById("list");
        document.getElementById("result-count").textContent =
          `${list.length} place${list.length === 1 ? "" : "s"}`;

        if (!list.length) {
          el.innerHTML =
            '<p class="p-8 text-sm text-slate-400 text-center">No matches. Try clearing filters.</p>';
          return;
        }

        if (!list.some((p) => p.name === selectedName)) {
          selectedName = list[0].name;
        }

        el.innerHTML = list
          .map((p) => {
            const active = p.name === selectedName;
            return `
            <button
              type="button"
              role="option"
              aria-selected="${active}"
              data-name="${escapeHtml(p.name)}"
              class="w-full text-left px-4 py-3.5 transition ${
                active
                  ? "bg-sky-50 border-l-4 border-l-sky-500"
                  : "hover:bg-slate-50 border-l-4 border-l-transparent"
              }"
            >
              <p class="font-semibold text-sm leading-snug ${
                active ? "text-sky-950" : "text-slate-900"
              }">${escapeHtml(p.name)}</p>
              <p class="text-xs text-slate-500 mt-1">${escapeHtml(p.type)}</p>
              <p class="text-xs font-medium text-slate-600 mt-1.5 truncate">
                ${escapeHtml(p.station)}
              </p>
            </button>
          `;
          })
          .join("");

        el.querySelectorAll("button[data-name]").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectedName = btn.dataset.name;
            renderList();
            renderDetailAndMap();
            if (window.innerWidth < 768) {
              document
                .getElementById("detail")
                .scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        });

        renderDetailAndMap();
      }

      function renderDetailAndMap() {
        paintModeButtons();
        const p = properties.find((x) => x.name === selectedName);
        if (!p) return;

        const embed = embedFor(p, mode);
        const modeLabel = mode === "drive" ? "Drive" : "Walk";

        const pinLink = p.map
          ? `<a href="${escapeHtml(
              p.map,
            )}" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-700 hover:text-slate-900">
              Place on Google Maps
              <span aria-hidden="true">↗</span>
            </a>`
          : "";

        const pgLink = p.propertyGuru
          ? `<a href="${escapeHtml(
              p.propertyGuru,
            )}" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-700 hover:text-slate-900">
              PropertyGuru
              <span aria-hidden="true">↗</span>
            </a>`
          : "";

        const dirLink = `<a href="${escapeHtml(
          googleDirUrl(p, mode),
        )}" target="_blank" rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 text-sm font-semibold text-sky-700 hover:text-sky-900">
          Open ${modeLabel.toLowerCase()} route
          <span aria-hidden="true">↗</span>
        </a>`;

        document.getElementById("detail").innerHTML = `
        <div class="space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">
                ${escapeHtml(p.name)}
              </h2>
              <div class="mt-2.5 flex flex-wrap gap-1.5">
                ${badge(p.type, typeClasses(p.type))}
                ${badge(p.station, "bg-slate-100 text-slate-600 ring-slate-500/10")}
                ${badge(
                  modeLabel + " to station",
                  mode === "drive"
                    ? "bg-amber-50 text-amber-900 ring-amber-600/15"
                    : "bg-emerald-50 text-emerald-800 ring-emerald-600/15",
                )}
              </div>
            </div>
            <div class="flex flex-col sm:items-end gap-2 shrink-0">
              ${dirLink}
              ${pinLink}
              ${pgLink}
            </div>
          </div>

          <div class="rounded-xl bg-slate-50 border border-slate-100 px-3 py-3 sm:px-4">
            <div class="flex items-center gap-2 sm:gap-3 text-sm">
              <div class="min-w-0 flex-1">
                <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400">From</p>
                <p class="font-semibold text-slate-900 truncate">${escapeHtml(
                  p.name,
                )}</p>
              </div>
              <div class="shrink-0 flex flex-col items-center px-1 text-center">
                <span class="text-[10px] font-bold uppercase tracking-wide ${
                  mode === "drive" ? "text-amber-600" : "text-emerald-600"
                }">${modeLabel}</span>
                <div class="my-1 flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full ${
                    mode === "drive" ? "bg-amber-500" : "bg-emerald-500"
                  }"></span>
                  <span class="w-10 sm:w-14 h-0.5 bg-slate-300"></span>
                  <span class="w-2 h-2 rounded-full bg-sky-500"></span>
                </div>
              </div>
              <div class="min-w-0 flex-1 text-right">
                <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400">To</p>
                <p class="font-semibold text-slate-900 truncate">${escapeHtml(
                  p.station,
                )}</p>
              </div>
            </div>
          </div>
        </div>
      `;

        if (embed) {
          setMap(embed);
        } else {
          document.getElementById("map-empty-title").textContent =
            "Map embed not added yet";
          document.getElementById("map-empty-body").textContent =
            `Use “Open ${modeLabel.toLowerCase()} route” above, or paste the Google embed URL into directions.${mode} for this place.`;
          setMap("");
        }
      }

      // ——— Events ———
      document.getElementById("search").addEventListener("input", renderList);
      stationFilter.addEventListener("change", renderList);
      typeFilter.addEventListener("change", renderList);

      document.getElementById("reset-filters").addEventListener("click", () => {
        document.getElementById("search").value = "";
        stationFilter.value = "";
        typeFilter.value = "";
        renderList();
      });

      document.getElementById("mode-group").addEventListener("click", (e) => {
        const btn = e.target.closest(".mode-btn");
        if (!btn) return;
        mode = btn.dataset.mode;
        renderDetailAndMap();
      });

      // ——— Boot ———
      renderList();
    </script>
  </body>
